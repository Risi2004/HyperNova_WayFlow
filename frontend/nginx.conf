server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must always be re-checked so offline updates reach drivers.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths load the app, which handles routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
